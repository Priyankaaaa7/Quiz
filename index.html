<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Health Research Fundamentals - Quizzes</title>
    <style>
      :root {
        --bg: #f4f6f8;
        --card-bg: #ffffff;
        --accent: #2b6cb0;
        --accent-hover: #1e4e8c;
        --text: #1a202c;
        --muted: #64748b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      }
      .container {
        max-width: 640px;
        width: 100%;
        background: var(--card-bg);
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        padding: 40px;
      }
      h1 {
        font-size: 1.6rem;
        margin: 0 0 4px 0;
        text-align: center;
      }
      p.subtitle {
        text-align: center;
        color: var(--muted);
        margin: 0 0 32px 0;
        font-size: 0.95rem;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
      }
      @media (max-width: 480px) {
        .grid {
          grid-template-columns: 1fr;
        }
        .container {
          padding: 28px 20px;
        }
      }
      a.week-btn {
        display: block;
        text-align: center;
        text-decoration: none;
        background: var(--accent);
        color: #fff;
        padding: 18px 12px;
        border-radius: 10px;
        font-weight: 600;
        font-size: 1rem;
        transition:
          background 0.15s ease,
          transform 0.1s ease;
      }
      a.week-btn:hover {
        background: var(--accent-hover);
        transform: translateY(-2px);
      }
      a.week-btn:active {
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Health Research Fundamentals</h1>
      <p class="subtitle">Weekly Quizzes</p>
      <div class="grid" id="week-grid"></div>
    </div>

    <script>
      const totalWeeks = 9;
      const grid = document.getElementById("week-grid");
      for (let i = 1; i <= totalWeeks; i++) {
        const link = document.createElement("a");
        link.href = `week${i}.html`;
        link.className = "week-btn";
        link.textContent = `Week ${i}`;
        grid.appendChild(link);
      }
    </script>
  </body>
</html>
